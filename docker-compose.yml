version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: farm-aid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-farmaid}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/src/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  couchdb:
    image: couchdb:3.3
    container_name: farm-aid-couchdb
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-password123}
    ports:
      - "${COUCHDB_PORT:-5984}:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://admin:password123@localhost:5984/_up | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: farm-aid-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: farm-aid-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      couchdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./Backend/uploads:/app/uploads

volumes:
  postgres_data:
  couchdb_data:
  redis_data: